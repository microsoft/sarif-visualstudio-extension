# YAML replacement for microsoft.sarif-visualstudio-extension.signed (definition 10970).
# The official 1ES template generates the SBOM and publishes the signed artifacts.
trigger: none
pr: none
name: $(date:yyyyMMdd)$(rev:.r)
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    settings:
      networkIsolationPolicy: CloudMine,GitHub,ESRP
    pool:
      name: 1es-security-detections-hosted-pool-default
      image: img-security-detections-hosted-pool-default
      os: windows
    stages:
    - stage: BuildAndSign
      displayName: Build, test, and sign Viewer
      jobs:
      - job: BuildAndSignViewer
        displayName: Build and sign Viewer 2019 and 2022
        timeoutInMinutes: 60
        templateContext:
          outputs:
          - output: pipelineArtifact
            displayName: 'Publish Artifact: Viewer drop2019'
            targetPath: bld\bin\AnyCpu_Release\Sarif.Viewer.VisualStudio\Microsoft.Sarif.Viewer.vsix
            artifactName: viewer-drop2019
          - output: pipelineArtifact
            displayName: 'Publish Artifact: Viewer drop2022'
            targetPath: bld\bin\AnyCpu_Release\Sarif.Viewer.VisualStudio.2022\Microsoft.Sarif.Viewer.vsix
            artifactName: viewer-drop2022
        steps:
        - checkout: self
          submodules: recursive
          fetchDepth: 0
          fetchTags: false
        - task: NuGetAuthenticate@1
          displayName: Authenticate with internal NuGet feed
        - task: PowerShell@2
          displayName: Configure internal NuGet source
          inputs:
            targetType: inline
            script: |
              # Keep this feed configuration scoped to the pipeline checkout.
              @'
              <?xml version="1.0" encoding="utf-8"?>
              <configuration>
                <packageSources>
                  <clear />
                  <add key="Security-Detections-Build-Deps" value="https://pkgs.dev.azure.com/mseng/1ES/_packaging/Security-Detections-Build-Deps/nuget/v3/index.json" />
                </packageSources>
              </configuration>
              '@ | Set-Content -Path "$(Build.SourcesDirectory)\NuGet.Config" -Encoding UTF8
        - task: BatchScript@1
          displayName: Run VsDevCmd.bat
          inputs:
            filename: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat
            modifyEnvironment: true
        - task: PowerShell@2
          displayName: Build and Test
          inputs:
            filePath: scripts/BuildAndTest.ps1
        - task: EsrpCodeSigning@5
          displayName: ESRP CodeSigning Viewer 2019
          enabled: true
          inputs:
            ConnectedServiceName: PME-1es-sectools-esrp-signing
            AppRegistrationClientId: a20d4b7e-6051-4bd5-9dc3-295c457cdfbc
            AppRegistrationTenantId: 975f013f-7f24-47e8-a7d3-abc4752bf346
            AuthAKVName: kv-sectools-esrp-signing
            AuthCertName: esrp-authentication-certificate
            AuthSignCertName: esrp-request-signing-certificate
            FolderPath: bld\bin\AnyCpu_Release\Sarif.Viewer.VisualStudio
            Pattern: '*.vsix'
            ServiceEndpointUrl: https://api.esrp.microsoft.com/api/v2
            signConfigType: inlineSignParams
            inlineOperation: |-
              [
                {
                  "KeyCode": "CP-233016",
                  "OperationCode": "OpcSign",
                  "Parameters": {
                    "FileDigest": "/fd SHA256"
                  },
                  "ToolName": "sign",
                  "ToolVersion": "1.0"
                },
                {
                  "KeyCode": "CP-233016",
                  "OperationCode": "OpcVerify",
                  "Parameters": {},
                  "ToolName": "sign",
                  "ToolVersion": "1.0"
                }
              ]
        - task: EsrpCodeSigning@5
          displayName: ESRP CodeSigning Viewer 2022
          enabled: true
          inputs:
            ConnectedServiceName: PME-1es-sectools-esrp-signing
            AppRegistrationClientId: a20d4b7e-6051-4bd5-9dc3-295c457cdfbc
            AppRegistrationTenantId: 975f013f-7f24-47e8-a7d3-abc4752bf346
            AuthAKVName: kv-sectools-esrp-signing
            AuthCertName: esrp-authentication-certificate
            AuthSignCertName: esrp-request-signing-certificate
            FolderPath: bld\bin\AnyCpu_Release\Sarif.Viewer.VisualStudio.2022
            Pattern: '*.vsix'
            ServiceEndpointUrl: https://api.esrp.microsoft.com/api/v2
            signConfigType: inlineSignParams
            inlineOperation: |-
              [
                {
                  "KeyCode": "CP-233016",
                  "OperationCode": "OpcSign",
                  "Parameters": {
                    "FileDigest": "/fd SHA256"
                  },
                  "ToolName": "sign",
                  "ToolVersion": "1.0"
                },
                {
                  "KeyCode": "CP-233016",
                  "OperationCode": "OpcVerify",
                  "Parameters": {},
                  "ToolName": "sign",
                  "ToolVersion": "1.0"
                }
              ]
